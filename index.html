<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>College Lab Timings</title>
  <style>
    body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: #f3f7fc; color: #0b2545; }
    header { background: #0b2545; color: #ffffff; padding: 28px 24px; }
    header h1 { margin: 0 0 6px 0; font-size: 28px; }
    header p { margin: 0; color: #7fd3e6; }
    main { max-width: 760px; margin: 24px auto; padding: 0 16px; }
    .card { background: #ffffff; border-radius: 10px; padding: 20px; box-shadow: 0 1px 4px rgba(11, 37, 69, 0.12); }
    h2 { margin-top: 0; font-size: 20px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #d6e2f0; }
    th { background: #0b2545; color: #ffffff; font-weight: 600; }
    .code { font-family: Consolas, monospace; background: #e6f2fb; padding: 2px 6px; border-radius: 4px; }
    footer { max-width: 760px; margin: 0 auto 32px auto; padding: 0 16px; font-size: 13px; color: #3e4c63; }
  </style>
</head>
<body>
  <header>
    <h1 id="college">College Lab Timings</h1>
    <p>Participant code: <span id="code" class="code">loading...</span></p>
  </header>
  <main>
    <div class="card">
      <h2>College Lab Timings</h2>
      <table>
        <thead>
          <tr><th>Lab</th><th>Opens</th><th>Closes</th></tr>
        </thead>
        <tbody id="lab-slots">
          <tr><td colspan="3">Loading lab timings from data.json...</td></tr>
        </tbody>
      </table>
    </div>
  </main>
  <footer id="build">This page reads its content from data.json.</footer>
  <script src="app.js"></script>
</body>
</html>
